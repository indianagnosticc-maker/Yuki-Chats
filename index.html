<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yuki — Chats</title>
<style>
:root{
  --bg:#000;
  --panel:#080808;
  --panel2:#0d0d0d;
  --line:rgba(255,255,255,.085);
  --line2:rgba(255,255,255,.14);
  --text:#fff;
  --muted:rgba(255,255,255,.52);
  --dim:rgba(255,255,255,.30);
  --bubble:#151515;
  --mine:#f5f5f5;
  --mineText:#050505;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
body{overflow:hidden}
.app{height:100dvh;display:flex;background:
 radial-gradient(900px 500px at 50% -20%,rgba(255,255,255,.045),transparent 65%),
 #000}
.sidebar{
 width:330px;min-width:330px;border-right:1px solid var(--line);
 display:flex;flex-direction:column;background:rgba(4,4,4,.82);
 backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
 position:relative;z-index:3;
}
.side-head{padding:22px 18px 14px}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand-left{display:flex;align-items:center;gap:10px}
.logo{
 width:34px;height:34px;border:1px solid var(--line2);border-radius:50%;
 display:grid;place-items:center;font-size:11px;letter-spacing:1px;
 background:linear-gradient(145deg,#171717,#030303);
 box-shadow:0 0 25px rgba(255,255,255,.035)
}
.brand-name{font-weight:650;font-size:14px;letter-spacing:.5px}
.brand-sub{font-size:10px;color:var(--dim);margin-top:2px;letter-spacing:1.2px}
.icon{
 width:34px;height:34px;border:1px solid transparent;background:transparent;color:var(--muted);
 border-radius:9px;display:grid;place-items:center;transition:.22s var(--ease)
}
.icon:hover{background:#101010;border-color:var(--line2);color:#fff;transform:translateY(-1px)}
.search{
 display:flex;align-items:center;gap:9px;padding:0 12px;height:42px;
 border:1px solid var(--line);border-radius:11px;background:#090909;
 transition:.25s var(--ease)
}
.search:focus-within{border-color:var(--line2);background:#0c0c0c;box-shadow:0 0 0 3px rgba(255,255,255,.025)}
.search svg{width:15px;color:var(--dim);flex:none}
.search input{width:100%;border:0;outline:0;background:none;color:#fff;font-size:12px}
.search input::placeholder{color:var(--dim)}
.list{overflow:auto;padding:4px 9px 20px;scrollbar-width:none}
.list::-webkit-scrollbar,.messages::-webkit-scrollbar{display:none}
.chat{
 display:flex;align-items:center;gap:11px;padding:10px 9px;border-radius:11px;
 transition:.2s var(--ease);position:relative
}
.chat:hover{background:#0d0d0d}
.chat.active{background:#111}
.avatar{
 width:40px;height:40px;border-radius:50%;background:#111;border:1px solid var(--line2);
 display:grid;place-items:center;flex:none;color:#fff;font-size:12px;font-weight:600
}
.chat-info{min-width:0;flex:1}
.chat-top{display:flex;justify-content:space-between;gap:8px}
.chat-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:9px;color:var(--dim);flex:none}
.preview{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.empty{padding:45px 20px;text-align:center;color:var(--dim);font-size:11px;line-height:1.7}
.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}
.chat-head{
 height:70px;min-height:70px;border-bottom:1px solid var(--line);
 display:flex;align-items:center;padding:0 22px;gap:11px;
 background:rgba(0,0,0,.62);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
 z-index:2
}
.back{display:none}
.head-user{min-width:0}
.head-name{font-size:13px;font-weight:650}
.head-status{font-size:10px;color:var(--muted);margin-top:3px}
.messages{
 flex:1;overflow:auto;padding:28px clamp(16px,5vw,72px) 22px;
 display:flex;flex-direction:column;gap:7px;scroll-behavior:smooth
}
.day{text-align:center;font-size:9px;color:var(--dim);letter-spacing:1.3px;margin:5px 0 13px}
.msg-row{display:flex;max-width:min(76%,560px);animation:msgIn .38s var(--ease) both}
.msg-row.mine{align-self:flex-end}
.msg-row.theirs{align-self:flex-start}
.bubble{
 padding:9px 12px;border-radius:14px;background:var(--bubble);border:1px solid var(--line);
 color:#eee;font-size:12px;line-height:1.5;box-shadow:0 4px 20px rgba(0,0,0,.2)
}
.mine .bubble{background:var(--mine);color:var(--mineText);border-color:transparent;border-bottom-right-radius:5px}
.theirs .bubble{border-bottom-left-radius:5px}
.meta{font-size:8.5px;color:var(--dim);margin:4px 5px 0}
.mine .meta{text-align:right}
.composer-wrap{padding:10px clamp(12px,4vw,60px) calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000 25%)}
.composer{
 min-height:50px;display:flex;align-items:flex-end;gap:7px;padding:6px;
 border:1px solid var(--line2);border-radius:15px;background:#080808;
 box-shadow:0 12px 40px rgba(0,0,0,.35);transition:.25s var(--ease)
}
.composer:focus-within{border-color:rgba(255,255,255,.22);box-shadow:0 0 0 3px rgba(255,255,255,.025),0 12px 40px rgba(0,0,0,.4)}
.composer textarea{
 flex:1;resize:none;min-height:36px;max-height:120px;padding:9px 8px;
 border:0;outline:0;background:none;color:#fff;font-size:12px;line-height:1.45
}
.composer textarea::placeholder{color:var(--dim)}
.send{
 width:36px;height:36px;border:0;border-radius:10px;background:#fff;color:#000;
 display:grid;place-items:center;flex:none;transition:.2s var(--ease)
}
.send:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(255,255,255,.14)}
.send:active{transform:scale(.94)}
.overlay{display:none}
.find{
 position:absolute;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(12px);z-index:10;
 opacity:0;pointer-events:none;transition:.3s var(--ease)
}
.find.open{opacity:1;pointer-events:auto}
.find-card{
 position:absolute;top:78px;left:50%;transform:translate(-50%,-8px) scale(.98);
 width:min(480px,calc(100% - 28px));background:#090909;border:1px solid var(--line2);
 border-radius:16px;padding:16px;box-shadow:0 30px 90px rgba(0,0,0,.65);
 transition:.35s var(--ease)
}
.find.open .find-card{transform:translate(-50%,0) scale(1)}
.find-title{font-size:12px;font-weight:650;margin-bottom:4px}
.find-sub{font-size:10px;color:var(--muted);margin-bottom:14px}
.find-row{display:flex;gap:7px}
.find-row input{
 flex:1;height:42px;background:#000;border:1px solid var(--line);border-radius:10px;
 color:#fff;outline:0;padding:0 12px;font-size:12px
}
.find-row button{height:42px;border:0;border-radius:10px;background:#fff;color:#000;padding:0 15px;font-size:11px;font-weight:650}
.find-result{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:10px;display:none}
.find-result.show{display:flex;align-items:center;gap:10px;animation:msgIn .3s var(--ease)}
.result-info{flex:1;min-width:0}
.result-name{font-size:12px;font-weight:600}
.result-id{font-size:10px;color:var(--muted);margin-top:2px}
.open-chat{background:#fff;color:#000;border:0;border-radius:8px;padding:8px 10px;font-size:10px;font-weight:650}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:720px){
 .sidebar{width:100%;min-width:0;border-right:0}
 .main{display:none}
 .app.chat-open .sidebar{display:none}
 .app.chat-open .main{display:flex}
 .back{display:grid}
 .side-head{padding-top:max(16px,env(safe-area-inset-top))}
 .chat-head{padding:0 13px}
 .messages{padding-left:14px;padding-right:14px}
 .msg-row{max-width:84%}
 .overlay{display:block}
}
@media(min-width:721px){.find{display:block}}

.auth-screen{
 position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(650px 380px at 50% 20%,rgba(139,124,255,.09),transparent 70%),#000;
 padding:20px;transition:opacity .3s ease,visibility .3s ease
}
.auth-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.auth-card{
 width:min(380px,100%);padding:30px 22px;border:1px solid rgba(255,255,255,.11);
 border-radius:18px;background:rgba(10,10,10,.88);box-shadow:0 30px 100px rgba(0,0,0,.7);
 backdrop-filter:blur(20px);text-align:center
}
.auth-logo{
 width:44px;height:44px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
 border:1px solid rgba(255,255,255,.18);background:#111;font-size:13px
}
.auth-title{font-size:20px;font-weight:700;letter-spacing:.5px}
.auth-sub{font-size:9px;color:rgba(255,255,255,.4);letter-spacing:2px;margin-top:5px;margin-bottom:24px}
.auth-fields{display:flex;flex-direction:column;gap:8px}
.auth-input{
 width:100%;height:44px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.09);
 outline:none;background:#070707;color:#fff;font-size:12px;transition:.2s ease
}
.auth-input:focus{border-color:rgba(255,255,255,.25);background:#0a0a0a}
.auth-input.optional{display:none}
.auth-card.signup .auth-input.optional{display:block}
.auth-main{
 width:100%;height:44px;margin-top:10px;border:0;border-radius:10px;background:#fff;color:#000;
 font-size:11px;font-weight:700;letter-spacing:.8px;cursor:pointer
}
.auth-main:disabled{opacity:.5;cursor:wait}
.auth-message{min-height:30px;padding-top:10px;color:#ff7185;font-size:10px;line-height:1.5}
.auth-switch{border:0;background:none;color:rgba(255,255,255,.45);font-size:10px;cursor:pointer}
.auth-switch b{color:#fff;font-weight:600}
.firebase-state{
 font-size:9px;color:rgba(255,255,255,.35);margin-top:13px
}
</style>
</head>
<body>
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">Y</div>
    <div class="auth-title">Yuki</div>
    <div class="auth-sub" id="authSub">PRIVATE MESSAGING</div>

    <div class="auth-fields">
      <input id="authDisplay" class="auth-input optional" placeholder="Display name" autocomplete="name">
      <input id="authUsername" class="auth-input optional" placeholder="@username" autocomplete="username">
      <input id="authEmail" class="auth-input" type="email" placeholder="Email" autocomplete="email">
      <input id="authPassword" class="auth-input" type="password" placeholder="Password" autocomplete="current-password">
    </div>

    <button class="auth-main" id="authSubmit">SIGN IN</button>
    <div class="auth-message" id="authMessage"></div>
    <button class="auth-switch" id="authSwitch">Don't have an account? <b>Sign up</b></button>
  </div>
</div>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="side-head">
      <div class="brand">
        <div class="brand-left">
          <div class="logo">Y</div>
          <div><div class="brand-name" id="brand-name">Yuki</div><div class="brand-sub">CHATS</div></div>
        </div>
        <button class="icon" id="logoutBtn" aria-label="Log out" title="Log out">↪</button><button class="icon" id="newChat" aria-label="New chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg>
        <input id="chatSearch" placeholder="Search chats or ID">
      </label>
    </div>
    <div class="list" id="chatList"></div>
  </aside>

  <main class="main">
    <header class="chat-head">
      <button class="icon back" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="avatar" id="headAvatar">A</div>
      <div class="head-user"><div class="head-name" id="headName">Select a chat</div><div class="head-status" id="headStatus">Choose someone from your chats</div></div>
    </header>

    <section class="messages" id="messages"></section>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="messageInput" rows="1" placeholder="Write a message…"></textarea>
        <button class="send" type="submit" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7Z"/></svg>
        </button>
      </form>
    </div>
  </main>

  <div class="find" id="find">
    <div class="find-card">
      <div class="find-title">Start a new chat</div>
      <div class="find-sub">Search a user by their ID and open a conversation.</div>
      <div class="find-row">
        <input id="idInput" placeholder="Enter user ID">
        <button id="findBtn">Search</button>
      </div>
      <div class="find-result" id="findResult">
        <div class="avatar" id="resultAvatar">U</div>
        <div class="result-info"><div class="result-name" id="resultName"></div><div class="result-id" id="resultId"></div></div>
        <button class="open-chat" id="openFound">Chat</button>
      </div>
    </div>
  </div>
</div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, setPersistence, browserLocalPersistence,
  sendEmailVerification
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, collection,
  query, where, orderBy, limit, onSnapshot, serverTimestamp, getDocs, increment
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDZWHHSGkbdN5NLRdBKwecHHf7m2yu5cAk",
  authDomain: "yuki-820b3.firebaseapp.com",
  projectId: "yuki-820b3",
  storageBucket: "yuki-820b3.firebasestorage.app",
  messagingSenderId: "1055284096143",
  appId: "1:1055284096143:web:f9463859371eb606db14fa"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
setPersistence(auth, browserLocalPersistence).catch(()=>{});

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const YUKI_BOT_UID = "__yuki_ai__";

let currentUser = null;
let currentProfile = null;
let currentPeer = null;
let activeChatId = null;
let unsubMessages = null;
let unsubRoster = null;
let yukiHistory = [];
let signup = false;
let chats = [];

const chatList = $("chatList");
const messages = $("messages");

function chatId(a,b){ return [a,b].sort().join("__"); }
function clock(ts){
  if(!ts) return "";
  const d=ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",hour12:false});
}
function toast(msg){
  $("authMessage").textContent = msg;
  setTimeout(()=>{ if($("authMessage").textContent===msg) $("authMessage").textContent=""; },3500);
}
function profileName(p){ return p?.display || p?.username || "User"; }

function setAuthMode(v){
  signup=v;
  $("authScreen").querySelector(".auth-card").classList.toggle("signup",signup);
  $("authSub").textContent=signup ? "CREATE YOUR ACCOUNT" : "PRIVATE MESSAGING";
  $("authSubmit").textContent=signup ? "CREATE ACCOUNT" : "SIGN IN";
  $("authSwitch").innerHTML=signup
    ? 'Already registered? <b>Sign in</b>'
    : "Don't have an account? <b>Sign up</b>";
  $("authPassword").autocomplete=signup ? "new-password" : "current-password";
  $("authMessage").textContent="";
}
$("authSwitch").onclick=()=>setAuthMode(!signup);

$("authSubmit").onclick=async()=>{
  const email=$("authEmail").value.trim().toLowerCase();
  const password=$("authPassword").value;
  const username=$("authUsername").value.trim().replace(/^@/,"").toLowerCase();
  const display=$("authDisplay").value.trim();
  if(!email || !password || (signup && !username)){toast("Please fill the required fields.");return;}
  if(password.length<6){toast("Password must be at least 6 characters.");return;}
  const btn=$("authSubmit");btn.disabled=true;
  try{
    if(signup){
      const existing=await getDocs(query(collection(db,"users"),where("username","==",username),limit(1)));
      if(!existing.empty) throw new Error("That username is already taken.");
      const cred=await createUserWithEmailAndPassword(auth,email,password);
      const p={
        username, display:display||username, email,
        createdAt:serverTimestamp(), lastSeen:serverTimestamp(), emailVerified:false
      };
      await setDoc(doc(db,"users",cred.user.uid),p,{merge:true});
      await setDoc(doc(db,"usernames",username),{uid:cred.user.uid},{merge:true});
      try{await sendEmailVerification(cred.user);}catch(_){}
      $("authMessage").textContent="Account created. Verify your email if verification is required.";
    }else{
      await signInWithEmailAndPassword(auth,email,password);
    }
  }catch(e){
    const map={
      "auth/invalid-credential":"Incorrect email or password.",
      "auth/email-already-in-use":"Email is already registered.",
      "auth/invalid-email":"Enter a valid email.",
      "auth/weak-password":"Password is too weak."
    };
    toast(map[e.code]||e.message||"Authentication failed.");
  }finally{btn.disabled=false;}
};

async function loadProfile(){
  const snap=await getDoc(doc(db,"users",currentUser.uid));
  if(snap.exists()) currentProfile=snap.data();
  else{
    const u=(currentUser.email||"user").split("@")[0].replace(/[^a-z0-9_]/gi,"_").toLowerCase();
    currentProfile={username:u,display:u,email:currentUser.email};
    await setDoc(doc(db,"users",currentUser.uid),currentProfile,{merge:true});
    await setDoc(doc(db,"usernames",u),{uid:currentUser.uid},{merge:true});
  }
  $("brand-name").textContent = currentProfile.display || currentProfile.username;
}

function renderMessages(c){
  messages.innerHTML="";
  const day=document.createElement("div");day.className="day";day.textContent="CHAT";messages.appendChild(day);
  if(!c?.length){
    const e=document.createElement("div");e.className="empty";e.textContent="No messages yet.";messages.appendChild(e);return;
  }
  c.forEach(m=>{
    const row=document.createElement("div");
    row.className="msg-row "+(m.by===currentUser.uid?"mine":"theirs");
    const bubble=document.createElement("div");bubble.className="bubble";bubble.innerHTML=esc(m.text).replace(/\n/g,"<br>");
    const meta=document.createElement("div");meta.className="meta";meta.textContent=clock(m.at);
    row.append(bubble,meta);messages.appendChild(row);
  });
  messages.scrollTop=messages.scrollHeight;
}

function renderRoster(){
  chatList.innerHTML="";
  const bot=document.createElement("div");
  bot.className="chat "+(currentPeer?.uid===YUKI_BOT_UID?"active":"");
  bot.innerHTML=`<div class="avatar">Y</div><div class="chat-info"><div class="chat-top"><span class="chat-name">Yuki AI</span><span class="chat-time">AI</span></div><div class="preview">Chat with Yuki</div></div>`;
  bot.onclick=()=>openBot();
  chatList.appendChild(bot);

  chats.forEach(item=>{
    const row=document.createElement("div");
    row.className="chat "+(currentPeer?.uid===item.uid?"active":"");
    row.innerHTML=`<div class="avatar">${esc((item.display||item.username||"U").slice(0,1).toUpperCase())}</div>
      <div class="chat-info"><div class="chat-top"><span class="chat-name">${esc(profileName(item))}</span><span class="chat-time">${esc(item.lastTime||"")}</span></div>
      <div class="preview">${esc(item.lastMsg||"Start a conversation")}</div></div>`;
    row.onclick=()=>openUser(item.uid,item);
    chatList.appendChild(row);
  });
}

function clearSubscription(){if(unsubMessages){unsubMessages();unsubMessages=null;}}
function openBot(){
  if(!currentUser)return;
  clearSubscription();
  currentPeer={uid:YUKI_BOT_UID,username:"yuki_ai",display:"Yuki AI",isYuki:true};
  activeChatId=chatId(currentUser.uid,YUKI_BOT_UID);
  $("headAvatar").textContent="Y";
  $("headName").textContent="Yuki AI";
  $("headStatus").textContent="AI assistant";
  $("app").classList.add("chat-open");
  yukiHistory=[];
  subscribeMessages();
  renderRoster();
}

function openUser(uid,p){
  clearSubscription();
  currentPeer={uid,username:p.username,display:p.display||p.username};
  activeChatId=chatId(currentUser.uid,uid);
  $("headAvatar").textContent=(profileName(p)[0]||"U").toUpperCase();
  $("headName").textContent=profileName(p);
  $("headStatus").textContent="@"+p.username;
  $("app").classList.add("chat-open");
  setDoc(doc(db,"chats",activeChatId),{
    users:[currentUser.uid,uid],
    [`participants.${currentUser.uid}`]:true,
    [`participants.${uid}`]:true,
    touchAt:serverTimestamp()
  },{merge:true}).catch(()=>{});
  subscribeMessages();
  renderRoster();
}

function subscribeMessages(){
  const ref=collection(db,"chats",activeChatId,"messages");
  const q=query(ref,orderBy("at","asc"),limit(300));
  unsubMessages=onSnapshot(q,snap=>{
    const arr=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderMessages(arr);
  },err=>console.error("message listener",err));
}

async function sendMessage(){
  const input=$("messageInput"),text=input.value.trim();
  if(!text||!currentUser||!currentPeer)return;
  input.value="";input.style.height="36px";
  await addDoc(collection(db,"chats",activeChatId,"messages"),{
    text,by:currentUser.uid,at:serverTimestamp(),seen:false
  });
  await setDoc(doc(db,"chats",activeChatId),{
    users:[currentUser.uid,currentPeer.uid],
    [`participants.${currentUser.uid}`]:true,
    [`participants.${currentPeer.uid}`]:true,
    lastMsg:text.slice(0,80),lastMsgAt:serverTimestamp(),lastMsgBy:currentUser.uid,
    touchAt:serverTimestamp(),
    unread:currentPeer.isYuki ? {} : {[currentPeer.uid]:increment(1),[currentUser.uid]:0}
  },{merge:true});

  if(currentPeer.isYuki){
    setTimeout(()=>askYuki(text),500);
  }
}

async function askYuki(text){
  let reply="Neural link unstable. Retry transmission.";
  try{
    const r=await fetch("/api/yuki",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text,history:yukiHistory})
    });
    if(r.ok){
      const data=await r.json();
      reply=data.reply||data.response||data.message||data.text||data.result||reply;
      if(typeof reply!=="string")reply=JSON.stringify(reply);
    }
  }catch(e){console.error(e);}
  yukiHistory.push({role:"user",content:text},{role:"assistant",content:reply});
  yukiHistory=yukiHistory.slice(-20);
  await addDoc(collection(db,"chats",activeChatId,"messages"),{
    text:reply,by:YUKI_BOT_UID,at:serverTimestamp(),seen:true
  });
  await setDoc(doc(db,"chats",activeChatId),{
    lastMsg:reply.slice(0,80),lastMsgAt:serverTimestamp(),lastMsgBy:YUKI_BOT_UID,touchAt:serverTimestamp()
  },{merge:true});
}

async function searchUser(){
  const raw=$("chatSearch").value.trim().toLowerCase().replace(/^@/,"");
  if(!raw||!currentUser)return;
  try{
    let uid=null,p=null;
    const uname=await getDoc(doc(db,"usernames",raw));
    if(uname.exists()){
      uid=uname.data().uid;
      const u=await getDoc(doc(db,"users",uid));if(u.exists())p=u.data();
    }else{
      const q=query(collection(db,"users"),where("username","==",raw),limit(1));
      const s=await getDocs(q);
      if(!s.empty){uid=s.docs[0].id;p=s.docs[0].data();}
    }
    if(!uid||!p){alert("User not found: @"+raw);return;}
    if(uid===currentUser.uid){alert("You cannot chat with yourself.");return;}
    if(!chats.some(x=>x.uid===uid))chats.unshift({uid,...p,lastMsg:"Start a conversation"});
    openUser(uid,p);renderRoster();
  }catch(e){console.error(e);alert("Search failed.");}
}

$("chatSearch").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();searchUser();}
});
$("chatSearch").addEventListener("input",()=>{
  const q=$("chatSearch").value.toLowerCase().replace(/^@/,"");
  document.querySelectorAll("#chatList .chat").forEach((r,i)=>{
    if(i===0)return;
    r.style.display=r.innerText.toLowerCase().includes(q)?"flex":"none";
  });
});
$("composer").onsubmit=e=>{e.preventDefault();sendMessage();};
$("messageInput").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});
$("messageInput").addEventListener("input",e=>{
  e.target.style.height="36px";e.target.style.height=Math.min(e.target.scrollHeight,120)+"px";
});
$("backBtn").onclick=()=>$("app").classList.remove("chat-open");

$("logoutBtn").onclick=async()=>{await signOut(auth);};
$("newChat").onclick=()=>{
  $("chatSearch").focus();
  $("chatSearch").placeholder="Enter @username and press Enter";
};
$("brand-name").id="brand-name";

async function subscribeRoster(){
  if(unsubRoster)unsubRoster();
  const q=query(collection(db,"chats"),where("users","array-contains",currentUser.uid));
  unsubRoster=onSnapshot(q,async snap=>{
    const out=[];
    for(const d of snap.docs){
      const data=d.data();
      const uid=data.users?.find(x=>x!==currentUser.uid);
      if(!uid||uid===YUKI_BOT_UID)continue;
      const u=await getDoc(doc(db,"users",uid));
      if(u.exists())out.push({uid,...u.data(),lastMsg:data.lastMsg||"",lastTime:clock(data.lastMsgAt||data.touchAt)});
    }
    out.sort((a,b)=>(b.lastTime||"").localeCompare(a.lastTime||""));
    chats=out;renderRoster();
  });
}

$("authPassword").addEventListener("keydown",e=>{if(e.key==="Enter")$("authSubmit").click();});

onAuthStateChanged(auth,async user=>{
  if(!user){
    currentUser=null;currentProfile=null;clearSubscription();
    $("authScreen").classList.remove("hidden");
    return;
  }
  if(!user.emailVerified){
    $("authScreen").classList.remove("hidden");
    $("authMessage").textContent="Please verify your email, then sign in again.";
    return;
  }
  currentUser=user;
  try{
    await loadProfile();
    $("authScreen").classList.add("hidden");
    await subscribeRoster();
    renderRoster();
    openBot();
  }catch(e){
    console.error(e);toast("Could not load your profile.");
  }
});
</script>
