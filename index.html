<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yuki — Chats</title>
<style>
:root{
  --bg:#000;
  --panel:#080808;
  --panel2:#0d0d0d;
  --line:rgba(255,255,255,.085);
  --line2:rgba(255,255,255,.14);
  --text:#fff;
  --muted:rgba(255,255,255,.55);
  --dim:rgba(255,255,255,.32);
  --bubble:#141414;
  --bubble-border:rgba(255,255,255,.08);
  --mine:#ffffff;
  --mineText:#000000;
  --accent:#3b82f6;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}

.app{
  width:100%;height:100dvh;min-height:0;display:flex;overflow:hidden;
  background:radial-gradient(900px 500px at 50% -20%,rgba(255,255,255,.045),transparent 65%),#000;
}

/* Sidebar */
.sidebar{
  min-height:0;width:340px;min-width:340px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;background:rgba(6,6,6,.85);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  position:relative;z-index:3;
}
.side-head{padding:20px 16px 14px;border-bottom:1px solid rgba(255,255,255,.04)}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand-left{display:flex;align-items:center;gap:11px}
.logo{
  width:36px;height:36px;border:1px solid var(--line2);border-radius:50%;
  display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:1px;
  background:linear-gradient(145deg,#202020,#080808);
  box-shadow:0 0 20px rgba(255,255,255,.05)
}
.brand-name{font-weight:650;font-size:14px;letter-spacing:.3px;line-height:1.2}
.brand-sub{font-size:10px;color:var(--dim);letter-spacing:1.2px;font-weight:600}
.brand-actions{display:flex;align-items:center;gap:6px}
.icon{
  width:34px;height:34px;border:1px solid transparent;background:transparent;color:var(--muted);
  border-radius:9px;display:grid;place-items:center;transition:.2s var(--ease)
}
.icon:hover{background:#151515;border-color:var(--line2);color:#fff}
.icon:active{transform:scale(.95)}

.search-wrap{position:relative}
.search{
  display:flex;align-items:center;gap:10px;padding:0 12px;height:42px;
  border:1px solid var(--line);border-radius:12px;background:#0d0d0d;
  transition:.25s var(--ease)
}
.search:focus-within{border-color:var(--line2);background:#121212;box-shadow:0 0 0 3px rgba(255,255,255,.03)}
.search svg{width:16px;height:16px;color:var(--dim);flex:none}
.search input{width:100%;border:0;outline:0;background:none;color:#fff;font-size:13px}
.search input::placeholder{color:var(--dim)}
.search-clear{
  background:none;border:0;color:var(--dim);display:none;align-items:center;justify-content:center;
  padding:4px;cursor:pointer;border-radius:50%
}
.search-clear:hover{color:#fff}
.search.has-val .search-clear{display:flex}

.list-section-title{
  padding:12px 18px 6px;font-size:10px;font-weight:650;letter-spacing:1px;
  color:var(--dim);text-transform:uppercase
}
.list{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 8px 24px;scrollbar-width:none}
.list::-webkit-scrollbar,.messages::-webkit-scrollbar{display:none}

.chat{
  display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:12px;
  transition:.15s var(--ease);position:relative;cursor:pointer;user-select:none;margin-bottom:2px
}
.chat:hover{background:#111111}
.chat.active{background:#171717;border:1px solid rgba(255,255,255,.08)}
.avatar{
  width:42px;height:42px;border-radius:50%;background:#161616;border:1px solid var(--line2);
  display:grid;place-items:center;flex:none;color:#fff;font-size:13px;font-weight:600;position:relative
}
.online-dot{
  width:10px;height:10px;background:#10b981;border:2px solid #000;border-radius:50%;
  position:absolute;bottom:0;right:0
}
.chat-info{min-width:0;flex:1}
.chat-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chat-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:10px;color:var(--dim);flex:none}
.chat-bottom{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:3px}
.preview{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.unread-badge{
  background:#fff;color:#000;font-size:9.5px;font-weight:700;border-radius:10px;
  padding:1px 6px;min-width:18px;text-align:center;line-height:16px
}

.empty-state{padding:50px 20px;text-align:center;color:var(--dim);font-size:12px;line-height:1.6}
.quick-action-row{
  display:flex;align-items:center;gap:12px;padding:10px;margin-top:6px;
  border-radius:12px;background:rgba(255,255,255,.03);border:1px dashed var(--line2);
  cursor:pointer;transition:.2s var(--ease)
}
.quick-action-row:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.3)}

/* Main Chat Section */
.main{min-width:0;min-height:0;flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#000}
.chat-head{
  height:68px;min-height:68px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 20px;gap:12px;
  background:rgba(0,0,0,.75);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  z-index:2
}
.back{display:none}
.head-user{min-width:0;flex:1}
.head-name{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-status{font-size:11px;color:var(--muted);margin-top:2px}
.head-actions{display:flex;gap:6px}

.messages{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:24px clamp(16px,4vw,60px) 16px;
  display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth
}
.day{text-align:center;font-size:10px;color:var(--dim);letter-spacing:1px;margin:8px 0 14px;font-weight:600}
.msg-row{display:flex;flex-direction:column;max-width:min(78%,540px);animation:msgIn .25s var(--ease) both}
.msg-row.mine{align-self:flex-end;align-items:flex-end}
.msg-row.theirs{align-self:flex-start;align-items:flex-start}
.bubble{
  padding:10px 14px;border-radius:16px;background:var(--bubble);border:1px solid var(--bubble-border);
  color:#f0f0f0;font-size:13px;line-height:1.5;box-shadow:0 3px 14px rgba(0,0,0,.25);word-break:break-word
}
.mine .bubble{background:var(--mine);color:var(--mineText);border-color:transparent;border-bottom-right-radius:4px}
.theirs .bubble{border-bottom-left-radius:4px}
.meta{font-size:9px;color:var(--dim);margin:4px 6px 0;display:flex;align-items:center;gap:4px}
.mine .meta{color:rgba(255,255,255,.45)}

/* Composer */
.composer-wrap{flex:none;padding:10px clamp(12px,4vw,50px) calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000 35%)}
.composer{
  min-height:50px;display:flex;align-items:flex-end;gap:8px;padding:6px 8px 6px 12px;
  border:1px solid var(--line2);border-radius:16px;background:#0c0c0c;
  box-shadow:0 10px 30px rgba(0,0,0,.4);transition:.2s var(--ease)
}
.composer:focus-within{border-color:rgba(255,255,255,.25);box-shadow:0 0 0 3px rgba(255,255,255,.03)}
.composer textarea{
  flex:1;resize:none;min-height:36px;max-height:130px;padding:8px 0;
  border:0;outline:0;background:none;color:#fff;font-size:13px;line-height:1.4
}
.composer textarea::placeholder{color:var(--dim)}
.send{
  width:38px;height:38px;border:0;border-radius:11px;background:#fff;color:#000;
  display:grid;place-items:center;flex:none;transition:.18s var(--ease)
}
.send:hover{background:#f0f0f0;transform:translateY(-1px)}
.send:active{transform:scale(.93)}

/* Modal: Start new chat */
.find{
  position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  z-index:20;opacity:0;pointer-events:none;transition:.25s var(--ease);display:grid;place-items:center;padding:16px
}
.find.open{opacity:1;pointer-events:auto}
.find-card{
  width:min(440px,100%);background:#0c0c0c;border:1px solid var(--line2);
  border-radius:18px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.8);
  transform:scale(.96);transition:.25s var(--ease)
}
.find.open .find-card{transform:scale(1)}
.find-title{font-size:15px;font-weight:650;margin-bottom:4px}
.find-sub{font-size:11px;color:var(--muted);margin-bottom:16px;line-height:1.4}
.find-row{display:flex;gap:8px}
.find-row input{
  flex:1;height:42px;background:#000;border:1px solid var(--line);border-radius:10px;
  color:#fff;outline:0;padding:0 12px;font-size:12.5px
}
.find-row input:focus{border-color:var(--line2)}
.find-row button{
  height:42px;border:0;border-radius:10px;background:#fff;color:#000;
  padding:0 16px;font-size:12px;font-weight:650
}
.find-result{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;display:none;background:#050505}
.find-result.show{display:flex;align-items:center;gap:12px;animation:msgIn .25s var(--ease)}
.result-info{flex:1;min-width:0}
.result-name{font-size:13px;font-weight:600}
.result-id{font-size:11px;color:var(--muted);margin-top:2px}
.open-chat{background:#fff;color:#000;border:0;border-radius:8px;padding:7px 14px;font-size:11px;font-weight:650}

/* Auth modal overlay */
.auth-screen{
  position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(650px 380px at 50% 20%,rgba(255,255,255,.05),transparent 70%),#000;
  padding:20px;transition:opacity .25s ease,visibility .25s ease
}
.auth-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.auth-card{
  width:min(380px,100%);padding:32px 24px;border:1px solid rgba(255,255,255,.12);
  border-radius:20px;background:rgba(12,12,12,.92);box-shadow:0 30px 90px rgba(0,0,0,.8);
  backdrop-filter:blur(24px);text-align:center
}
.auth-logo{
  width:46px;height:46px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.2);background:#171717;font-size:15px;font-weight:700
}
.auth-title{font-size:22px;font-weight:700;letter-spacing:.3px}
.auth-sub{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:1.8px;margin-top:6px;margin-bottom:24px;font-weight:600}
.auth-fields{display:flex;flex-direction:column;gap:10px}
.auth-input{
  width:100%;height:44px;padding:0 14px;border-radius:11px;border:1px solid rgba(255,255,255,.1);
  outline:none;background:#070707;color:#fff;font-size:12.5px;transition:.2s ease
}
.auth-input:focus{border-color:rgba(255,255,255,.3);background:#0a0a0a}
.auth-input.optional{display:none}
.auth-card.signup .auth-input.optional{display:block}
.auth-main{
  width:100%;height:44px;margin-top:14px;border:0;border-radius:11px;background:#fff;color:#000;
  font-size:12px;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:.15s
}
.auth-main:hover{background:#f0f0f0}
.auth-main:disabled{opacity:.5;cursor:wait}
.auth-message{min-height:24px;padding-top:10px;color:#f87171;font-size:11px;line-height:1.4}
.auth-switch{border:0;background:none;color:rgba(255,255,255,.45);font-size:11px;cursor:pointer;margin-top:6px}
.auth-switch b{color:#fff;font-weight:600}

@keyframes msgIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}

/* Mobile layout adjustments */
@media(max-width:768px){
  .sidebar{width:100%;min-width:0;border-right:0}
  .main{display:none;width:100%}
  .app.chat-open .sidebar{display:none}
  .app.chat-open .main{display:flex}
  .back{display:grid}
  .side-head{padding-top:max(16px,env(safe-area-inset-top))}
  .chat-head{height:62px;min-height:62px;padding:0 14px}
  .messages{padding:16px 12px 10px}
  .msg-row{max-width:88%}
  .composer-wrap{padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">Y</div>
    <div class="auth-title">Yuki</div>
    <div class="auth-sub" id="authSub">PRIVATE MESSAGING</div>

    <div class="auth-fields">
      <input id="authDisplay" class="auth-input optional" placeholder="Display name" autocomplete="name">
      <input id="authUsername" class="auth-input optional" placeholder="@username" autocomplete="username">
      <input id="authEmail" class="auth-input" type="email" placeholder="Email address" autocomplete="email">
      <input id="authPassword" class="auth-input" type="password" placeholder="Password" autocomplete="current-password">
    </div>

    <button class="auth-main" id="authSubmit">SIGN IN</button>
    <div class="auth-message" id="authMessage"></div>
    <button class="auth-switch" id="authSwitch">Don't have an account? <b>Sign up</b></button>
  </div>
</div>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="side-head">
      <div class="brand">
        <div class="brand-left">
          <div class="logo">Y</div>
          <div>
            <div class="brand-name" id="brand-name">Yuki</div>
            <div class="brand-sub">CHATS</div>
          </div>
        </div>
        <div class="brand-actions">
          <button class="icon" id="logoutBtn" aria-label="Log out" title="Log out">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
          <button class="icon" id="newChat" aria-label="New chat" title="New chat">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>

      <div class="search-wrap">
        <label class="search" id="searchBox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="chatSearch" placeholder="Search chats or @username..." autocomplete="off">
          <button class="search-clear" id="searchClear" aria-label="Clear search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </label>
      </div>
    </div>

    <div class="list" id="chatList"></div>
  </aside>

  <main class="main">
    <header class="chat-head">
      <button class="icon back" id="backBtn" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="avatar" id="headAvatar">Y</div>
      <div class="head-user">
        <div class="head-name" id="headName">Yuki AI</div>
        <div class="head-status" id="headStatus">AI Assistant • Online</div>
      </div>
      <div class="head-actions">
        <button class="icon" id="clearChatBtn" title="Clear chat messages">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </header>

    <section class="messages" id="messages"></section>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="messageInput" rows="1" placeholder="Write a message..."></textarea>
        <button class="send" type="submit" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7Z"/></svg>
        </button>
      </form>
    </div>
  </main>

  <div class="find" id="find">
    <div class="find-card">
      <div class="find-title">Start a new conversation</div>
      <div class="find-sub">Search for anyone by username or Firebase User ID</div>
      <div class="find-row">
        <input id="idInput" placeholder="Enter @username or UID" autocomplete="off" autocapitalize="none">
        <button id="findBtn">Search</button>
      </div>
      <div class="find-result" id="findResult">
        <div class="avatar" id="resultAvatar">U</div>
        <div class="result-info">
          <div class="result-name" id="resultName">User</div>
          <div class="result-id" id="resultId">@user</div>
        </div>
        <button class="open-chat" id="openFound">Chat</button>
      </div>
    </div>
  </div>
</div>

  return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",hour12:false});
}

function toast(msg){
  $("authMessage").textContent = msg;
  setTimeout(()=>{ if($("authMessage").textContent===msg) $("authMessage").textContent=""; },3500);
}

function profileName(p){ return p?.display || p?.username || "User"; }

// Roster rendering with search filter integration
function renderRoster(filterText = ""){
  chatList.innerHTML = "";
  const query = filterText.trim().toLowerCase().replace(/^@/,"");

  // Yuki AI Chat item
  const botMatches = !query || "yuki ai".includes(query) || "assistant".includes(query);
  if(botMatches){
    const bot = document.createElement("div");
    bot.className = "chat " + (currentPeer?.uid === YUKI_BOT_UID ? "active" : "");
    bot.innerHTML = `
      <div class="avatar">Y<div class="online-dot"></div></div>
      <div class="chat-info">
        <div class="chat-top">
          <span class="chat-name">Yuki AI</span>
          <span class="chat-time">AI</span>
        </div>
        <div class="chat-bottom">
          <span class="preview">Neural companion • 24/7 online</span>
        </div>
      </div>`;
    bot.onclick = () => openBot();
    chatList.appendChild(bot);
  }

  // Filtered Chats
  let matchCount = 0;
  chats.forEach(item => {
    const name = (item.display || "").toLowerCase();
    const uname = (item.username || "").toLowerCase();
    const last = (item.lastMsg || "").toLowerCase();
    const isMatch = !query || name.includes(query) || uname.includes(query) || last.includes(query);

    if(isMatch){
      matchCount++;
      const row = document.createElement("div");
      row.className = "chat " + (currentPeer?.uid === item.uid ? "active" : "");
      const initial = (profileName(item)[0] || "U").toUpperCase();
      const unreadBadge = item.unread ? `<span class="unread-badge">${item.unread}</span>` : "";

      row.innerHTML = `
        <div class="avatar">${esc(initial)}</div>
        <div class="chat-info">
          <div class="chat-top">
            <span class="chat-name">${esc(profileName(item))}</span>
            <span class="chat-time">${esc(item.lastTime || "")}</span>
          </div>
          <div class="chat-bottom">
            <span class="preview">${esc(item.lastMsg || "Start a conversation")}</span>
            ${unreadBadge}
          </div>
        </div>`;
      row.onclick = () => {
        item.unread = 0;
        openUser(item.uid, item);
      };
      chatList.appendChild(row);
    }
  });

  // If searching and user is not in current list, provide quick search / start option
  if(query){
    const quickFind = document.createElement("div");
    quickFind.className = "quick-action-row";
    quickFind.innerHTML = `
      <div class="avatar" style="border-style:dashed">+</div>
      <div class="chat-info">
        <div class="chat-name" style="color:#fff">Search for "@${esc(query)}"</div>
        <div class="preview" style="color:var(--dim)">Click to find user by ID or start chat</div>
      </div>`;
    quickFind.onclick = () => {
      $("find").classList.add("open");
      $("idInput").value = query;
      $("findBtn").click();
    };
    chatList.appendChild(quickFind);
  } else if(!botMatches && matchCount === 0){
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "No conversations found.";
    chatList.appendChild(empty);
  }
}

// Render Messages on main screen
function renderMessages(msgList){
  messages.innerHTML = "";
  const day = document.createElement("div");
  day.className = "day";
  day.textContent = "TODAY";
  messages.appendChild(day);

  if(!msgList || !msgList.length){
    const e = document.createElement("div");
    e.className = "empty-state";
    e.innerHTML = `No messages yet.<br>Send a greeting to start chatting!`;
    messages.appendChild(e);
    return;
  }

  msgList.forEach(m => {
    const isMine = m.by === currentUser.uid;
    const row = document.createElement("div");
    row.className = "msg-row " + (isMine ? "mine" : "theirs");

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = esc(m.text).replace(/\n/g, "<br>");

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = clock(m.at);

    row.append(bubble, meta);
    messages.appendChild(row);
  });

  messages.scrollTop = messages.scrollHeight;
}

function clearSubscription(){
  if(unsubMessages){
    unsubMessages();
    unsubMessages = null;
  }
}

function openBot(){
  clearSubscription();
  currentPeer = { uid: YUKI_BOT_UID, username: "yuki_ai", display: "Yuki AI", isYuki: true };
  activeChatId = chatId(currentUser.uid, YUKI_BOT_UID);
  $("headAvatar").textContent = "Y";
  $("headName").textContent = "Yuki AI";
  $("headStatus").textContent = "AI Assistant • Online";
  $("app").classList.add("chat-open");
  yukiHistory = [];

  loadMessagesForActiveChat();
  renderRoster(searchInput.value);
}

function openUser(uid, p){
  clearSubscription();
  currentPeer = { uid, username: p.username, display: p.display || p.username };
  activeChatId = chatId(currentUser.uid, uid);
  $("headAvatar").textContent = (profileName(p)[0] || "U").toUpperCase();
  $("headName").textContent = profileName(p);
  $("headStatus").textContent = "@" + (p.username || "user") + " • Active now";
  $("app").classList.add("chat-open");

  if(db && currentUser.uid !== "demo_current_user"){
    setDoc(doc(db,"chats",activeChatId),{
      users:[currentUser.uid,uid],
      [`participants.${currentUser.uid}`]:true,
      [`participants.${uid}`]:true,
      touchAt:serverTimestamp()
    },{merge:true}).catch(()=>{});
  }

  loadMessagesForActiveChat();
  renderRoster(searchInput.value);
}

function loadMessagesForActiveChat(){
  if(db && currentUser.uid !== "demo_current_user"){
    try{
      const ref = collection(db, "chats", activeChatId, "messages");
      const q = query(ref, orderBy("at","asc"), limit(250));
      unsubMessages = onSnapshot(q, snap => {
        const arr = snap.docs.map(d=>({ id:d.id, ...d.data() }));
        renderMessages(arr);
      }, err => {
        console.warn("Falling back to local cache:", err);
        fallbackLocalMessages();
      });
      return;
    }catch(e){
      console.warn("DB listener fallback:", e);
    }
  }
  fallbackLocalMessages();
}

function fallbackLocalMessages(){
  const list = mockMessagesStore[activeChatId] || [];
  renderMessages(list);
}

async function sendMessage(){
  const input = $("messageInput");
  const text = input.value.trim();
  if(!text || !currentUser || !currentPeer) return;

  input.value = "";
  input.style.height = "36px";

  // Instant optimistic render
  const newMsg = { text, by: currentUser.uid, at: new Date() };
  if(!mockMessagesStore[activeChatId]){
    mockMessagesStore[activeChatId] = [];
  }
  mockMessagesStore[activeChatId].push(newMsg);

  // Update roster preview
  const existingChat = chats.find(c => c.uid === currentPeer.uid);
  if(existingChat){
    existingChat.lastMsg = text;
    existingChat.lastTime = clock(new Date());
  }

  renderMessages(mockMessagesStore[activeChatId]);
  renderRoster(searchInput.value);

  // Send to Firebase if connected
  if(db && currentUser.uid !== "demo_current_user"){
    try{
      await addDoc(collection(db,"chats",activeChatId,"messages"),{
        text, by:currentUser.uid, at:serverTimestamp(), seen:false
      });
      await setDoc(doc(db,"chats",activeChatId),{
        users:[currentUser.uid,currentPeer.uid],
        [`participants.${currentUser.uid}`]:true,
        [`participants.${currentPeer.uid}`]:true,
        lastMsg:text.slice(0,80), lastMsgAt:serverTimestamp(), lastMsgBy:currentUser.uid,
        touchAt:serverTimestamp()
      },{merge:true});
    }catch(err){
      console.warn("Message sync offline/demo:", err);
    }
  }

  // Yuki bot automatic reply
  if(currentPeer.isYuki){
    setTimeout(()=>{
      const aiReply = "Got it! Your message has been received and processed seamlessly.";
      mockMessagesStore[activeChatId].push({
        text: aiReply,
        by: YUKI_BOT_UID,
        at: new Date()
      });
      renderMessages(mockMessagesStore[activeChatId]);
      renderRoster(searchInput.value);
    }, 600);
  }
}

// Search bar interactivity
searchInput.addEventListener("input", e => {
  const val = e.target.value;
  searchBox.classList.toggle("has-val", val.length > 0);
  renderRoster(val);
});

searchClearBtn.addEventListener("click", () => {
  searchInput.value = "";
  searchBox.classList.remove("has-val");
  renderRoster("");
  searchInput.focus();
});

searchInput.addEventListener("keydown", e => {
  if(e.key === "Enter"){
    e.preventDefault();
    const q = searchInput.value.trim();
    if(q){
      const match = chats.find(c =>
        (c.username||"").toLowerCase() === q.toLowerCase().replace(/^@/,"") ||
        (c.display||"").toLowerCase().includes(q.toLowerCase())
      );
      if(match){
        openUser(match.uid, match);
      } else {
        $("find").classList.add("open");
        $("idInput").value = q;
        $("findBtn").click();
      }
    }
  }
});

$("composer").onsubmit = e => { e.preventDefault(); sendMessage(); };
$("messageInput").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
$("messageInput").addEventListener("input", e => {
  e.target.style.height = "36px";
  e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px";
});

$("backBtn").onclick = () => {
  $("app").classList.remove("chat-open");
};

$("clearChatBtn").onclick = () => {
  if(confirm("Clear conversation history for this chat?")){
    mockMessagesStore[activeChatId] = [];
    renderMessages([]);
  }
};

$("newChat").onclick = () => {
  $("find").classList.add("open");
  $("idInput").value = "";
  $("findResult").classList.remove("show");
  $("idInput").focus();
};

$("find").addEventListener("click", e => {
  if(e.target === $("find")) $("find").classList.remove("open");
});

$("findBtn").onclick = () => {
  const raw = $("idInput").value.trim().toLowerCase().replace(/^@/,"");
  if(!raw) return;
  const mockUser = {
    uid: "user_" + raw,
    username: raw,
    display: raw.charAt(0).toUpperCase() + raw.slice(1)
  };
  $("resultAvatar").textContent = mockUser.display[0];
  $("resultName").textContent = mockUser.display;
  $("resultId").textContent = "@" + mockUser.username;
  $("findResult").classList.add("show");

  $("openFound").onclick = () => {
    if(!chats.some(x => x.uid === mockUser.uid)){
      chats.unshift({ ...mockUser, lastMsg: "Started conversation", lastTime: "Just now" });
    }
    $("find").classList.remove("open");
    openUser(mockUser.uid, mockUser);
    renderRoster();
  };
};

$("idInput").addEventListener("keydown", e => {
  if(e.key === "Enter"){ e.preventDefault(); $("findBtn").click(); }
});

// Auth Screen toggles
function setAuthMode(v){
  signup = v;
  $("authScreen").querySelector(".auth-card").classList.toggle("signup", signup);
  $("authSub").textContent = signup ? "CREATE YOUR ACCOUNT" : "PRIVATE MESSAGING";
  $("authSubmit").textContent = signup ? "CREATE ACCOUNT" : "SIGN IN";
  $("authSwitch").innerHTML = signup
    ? 'Already registered? <b>Sign in</b>'
    : "Don't have an account? <b>Sign up</b>";
  $("authPassword").autocomplete = signup ? "new-password" : "current-password";
  $("authMessage").textContent = "";
}
$("authSwitch").onclick = () => setAuthMode(!signup);

$("authSubmit").onclick = async () => {
  const email = $("authEmail").value.trim().toLowerCase();
  const password = $("authPassword").value;
  const username = $("authUsername").value.trim().replace(/^@/,"").toLowerCase();
  const display = $("authDisplay").value.trim();

  if(!email || !password || (signup && !username)){
    toast("Please fill the required fields.");
    return;
  }
  const btn = $("authSubmit");
  btn.disabled = true;

  if(auth){
    try{
      if(signup){
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        currentUser = cred.user;
        currentProfile = { username, display: display || username, email };
      } else {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        currentUser = cred.user;
        currentProfile = { username: email.split("@")[0], display: email.split("@")[0], email };
      }
      $("authScreen").classList.add("hidden");
      $("brand-name").textContent = currentProfile.display;
      openBot();
    }catch(err){
      toast(err.message || "Authentication error.");
    }finally{
      btn.disabled = false;
    }
  } else {
    // Demo fallback sign-in
    currentUser = { uid: "user_" + (username || "demo"), email, emailVerified: true };
    currentProfile = { username: username || "demo", display: display || "User", email };
    $("authScreen").classList.add("hidden");
    $("brand-name").textContent = currentProfile.display;
    openBot();
  }
};

$("logoutBtn").onclick = async () => {
  if(auth){
    try{ await signOut(auth); }catch(_){}
  }
  $("authScreen").classList.remove("hidden");
};

// Auto start session with instant preview
$("authScreen").classList.add("hidden");
$("brand-name").textContent = currentProfile.display;
renderRoster();
openBot();

// Listen to Firebase auth if available in browser
if(auth){
  onAuthStateChanged(auth, user => {
    if(user && user.emailVerified){
      currentUser = user;
      $("authScreen").classList.add("hidden");
    }
  });
}
</script>
